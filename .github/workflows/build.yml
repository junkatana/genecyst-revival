name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: ninja -C build
      - name: Package
        run: |
          mkdir -p dist/genecyst-linux-x86_64
          cp build/genecyst README.md LICENSE dist/genecyst-linux-x86_64/
          cp third_party/genesis-plus-gx/LICENSE.txt dist/genecyst-linux-x86_64/LICENSE-genesis-plus-gx.txt
          tar -C dist -czf genecyst-linux-x86_64.tar.gz genecyst-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: genecyst-linux-x86_64
          path: genecyst-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkgconf
            zip
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: ninja -C build
      - name: Package
        run: |
          mkdir -p dist/genecyst-windows-x86_64
          cp build/genecyst.exe README.md LICENSE dist/genecyst-windows-x86_64/
          cp /mingw64/bin/SDL2.dll dist/genecyst-windows-x86_64/
          cp /mingw64/bin/zlib1.dll dist/genecyst-windows-x86_64/ || true
          cp third_party/genesis-plus-gx/LICENSE.txt dist/genecyst-windows-x86_64/LICENSE-genesis-plus-gx.txt
          cd dist && zip -r ../genecyst-windows-x86_64.zip genecyst-windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: genecyst-windows-x86_64
          path: genecyst-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/genecyst-linux-x86_64/genecyst-linux-x86_64.tar.gz
            artifacts/genecyst-windows-x86_64/genecyst-windows-x86_64.zip
          generate_release_notes: true
